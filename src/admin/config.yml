backend:
  name: github
  repo: initiativepatquercybouriane/Site_PAT   # à remplacer OK
  branch: main
locale: fr
media_folder: src/images/uploads
public_folder: /images/uploads
collections:
  - name: actualites
    label: Actualités
    folder: src/content/actualites
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - {label: Titre, name: title, widget: string}
      - {label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - {label: Image, name: image, widget: image, required: false}
      - {label: "Description de l'image", name: image_alt, widget: string, required: false}
      - {label: Texte, name: body, widget: markdown}
  - name: evenements
    label: Agenda
    folder: src/content/evenements
    create: true
    fields:
      - {label: Titre, name: title, widget: string}
      - {label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - {label: Horaire, name: horaire, widget: string, required: false}
      - {label: Lieu, name: lieu, widget: string}
      - {label: Résumé, name: resume, widget: text}
  - name: groupes
    label: Groupes et thèmes
    folder: src/content/groupes
    create: true
    fields:
      - {label: Nom du groupe, name: title, widget: string}
      - {label: Ordre d'affichage, name: ordre, widget: number}
      - {label: Description courte, name: resume, widget: text}
  - name: pages
    label: Pages
    files:
      - label: À propos
        name: apropos
        file: src/a-propos.md
        fields:
          - {label: Titre, name: title, widget: hidden, default: À propos}
          - {label: Layout, name: layout, widget: hidden, default: page.njk}
          - {label: Adresse, name: permalink, widget: hidden, default: /a-propos/}
          - {label: Texte, name: body, widget: markdown}
      - label: Mentions légales
        name: mentions
        file: src/mentions-legales.md
        fields:
          - {label: Titre, name: title, widget: hidden, default: Mentions légales}
          - {label: Layout, name: layout, widget: hidden, default: page.njk}
          - {label: Adresse, name: permalink, widget: hidden, default: /mentions-legales/}
          - {label: Texte, name: body, widget: markdown}
